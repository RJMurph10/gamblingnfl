name: SGO catalog probe
on:
  push:
    branches: [nfl-weather-probe]
    paths: [probe/sgo-catalog.mjs]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - env: { SPORTSGAMEODDS_API_KEY: "${{ secrets.SPORTSGAMEODDS_API_KEY }}" }
        run: node probe/sgo-catalog.mjs
