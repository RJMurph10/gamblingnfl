name: Period lines (SportsGameOdds)

# NHL period and full-game lines with prices from SportsGameOdds (free plan), saved to
# props-site/period-lines/nhl/<YYYY-MM-DDTHH>.json for period-total models (scripts/line-history/sgo-periods.mjs).
# Twice a day: late morning (around the open) and late afternoon (before the evening games), so the snapshots keep
# the opener and the move. ~25 events a day, inside the free plan's 2,500 a month together with the men's
# college basketball pull. ESPN's prop feed separately keeps DraftKings' opening and closing 1st-period lines.

on:
  schedule:
    - cron: "20 16 * 1-4,10-12 *" # 10:20 / 11:20 Central
    - cron: "20 22 * 1-4,10-12 *" # 4:20 / 5:20 Central, before the evening puck drops
  workflow_dispatch:
  push:
    branches: [nhl-period-lines]
    paths: [scripts/line-history/period-lines.trigger]

permissions:
  contents: write

concurrency:
  group: props-site-period-lines
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: app
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pull and publish
        env:
          SPORTSGAMEODDS_API_KEY: ${{ secrets.SPORTSGAMEODDS_API_KEY }}
        run: |
          set -e
          node app/scripts/line-history/sgo-periods.mjs --league NHL --out pull/nhl || echo "SportsGameOdds pull failed"
          if [ -z "$(find pull -name '*.json' 2>/dev/null)" ]; then echo "nothing pulled"; exit 0; fi
          url="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          for attempt in 1 2 3 4 5; do
            rm -rf site-repo && git clone -q --depth 1 --branch props-site "$url" site-repo
            mkdir -p site-repo/period-lines && cp -r pull/* site-repo/period-lines/
            cd site-repo
            git config user.name "line-history-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            if git diff --cached --quiet; then echo "no changes"; exit 0; fi
            git commit -q -m "Period lines $(date -u +%Y-%m-%dT%H:%MZ)"
            if git push -q origin props-site; then exit 0; fi
            cd ..
            sleep $((attempt * 15))
          done
          exit 1
