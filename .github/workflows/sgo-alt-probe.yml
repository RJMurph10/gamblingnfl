name: SGO alt-line probe (temporary)
on:
  push:
    branches: [sgo-alt-probe]
    paths: [scripts/line-history/sgo-alt-probe.mjs]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/line-history/sgo-alt-probe.mjs
        env:
          SPORTSGAMEODDS_API_KEY: ${{ secrets.SPORTSGAMEODDS_API_KEY }}
