name: CBB probe
on:
  push:
    branches: [cbb]
    paths: [scripts/cbb/probe.mjs]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/cbb/probe.mjs > probe-out.txt 2>&1 || true
      - run: |
          git config user.name "line-history-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch -q origin cbb-probe-out 2>/dev/null && git checkout -q -B out origin/cbb-probe-out || git checkout -q --orphan out
          git rm -rq --cached . 2>/dev/null || true
          git add -f probe-out.txt && git commit -q -m probe && git push -q -f origin HEAD:cbb-probe-out
