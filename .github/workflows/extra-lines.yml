name: Extra game lines (Odds API + SportsGameOdds)

# Lines for games ESPN shows none for, saved as snapshots to props-site/extra-lines/<source>/<league>/
# and merged into the season files by the hourly line saver (scripts/cbb/build-season.mjs):
#   - women's college basketball from The Odds API (2 credits a pull; keeps what the NFL prop prices
#     still need this month, so a pull is skipped when credits are short). Books post most women's lines
#     late in the day, so it pulls once a day close to tip-off: 4:40 PM Central on weekdays, 11:10 AM on
#     weekends (earlier tip-offs)
#   - men's college basketball from SportsGameOdds (free plan, 2,500 events a month: one pull a day, in the
#     morning; if GitHub drops the morning run, the next run that day does it)
#   - NBA from SportsGameOdds with the same morning pull, for line shopping (every book's lines)
# Both SportsGameOdds pulls also update props-site/best-lines/<league>.json (line shopping on the model pages).
# The men's pull also saves every posted player prop (DraftKings, FanDuel, BetMGM, Caesars) to
# props-site/extra-lines/sgo-props/cbb/, building a college props history at no extra cost.
# Each source does nothing without its repository secret (ODDS_API_KEY, SPORTSGAMEODDS_API_KEY).

on:
  schedule:
    - cron: "10 15 * * *" # 9:10 / 10:10 Central: men's (SportsGameOdds)
    - cron: "40 22 * * 1-5" # weekdays 4:40 / 5:40 PM Central: women's (Odds API), close to the evening tip-offs
    - cron: "10 17 * * 0,6" # weekends 11:10 AM / 12:10 PM Central: women's
  workflow_dispatch:
  push:
    branches: [odds-api-games]
    paths: [scripts/line-history/extra-lines.trigger]

permissions:
  contents: write

concurrency:
  group: props-site-odds-api
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: app
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pull lines and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          SPORTSGAMEODDS_API_KEY: ${{ secrets.SPORTSGAMEODDS_API_KEY }}
        run: |
          set -e
          cron="${{ github.event.schedule }}"
          # women's: every run except the morning one (manual runs too)
          if [ "$cron" != "10 15 * * *" ]; then
            node app/scripts/line-history/odds-api-games.mjs --sport basketball_wncaab --out pull/oddsapi/wcbb || echo "Odds API pull failed"
          fi
          # men's from SportsGameOdds once a day (to stay inside the free plan's monthly events): the morning run,
          # a manual run, or any later run when there's no snapshot from today yet (GitHub sometimes drops a run)
          today=$(date -u +%Y-%m-%d)
          have=$(gh api "repos/${{ github.repository }}/contents/extra-lines/sgo/cbb?ref=props-site" --jq '.[].name' 2>/dev/null | grep -c "^$today" || true)
          if [ "$cron" = "10 15 * * *" ] || [ "${{ github.event_name }}" != "schedule" ] || [ "$have" = "0" ]; then
            # player props come in the same events at no extra cost: saved to extra-lines/sgo-props/cbb
            node app/scripts/line-history/sgo-games.mjs --league NCAAB --hours 30 --out pull/sgo/cbb --props pull/sgo-props/cbb || echo "SportsGameOdds pull failed"
            # NBA, for line shopping only (every book's lines; ~8 events a day)
            node app/scripts/line-history/sgo-games.mjs --league NBA --hours 30 --out pull/sgo/nba || echo "SportsGameOdds NBA pull failed"
          fi
          if [ -z "$(find pull -name '*.json' 2>/dev/null)" ]; then echo "nothing pulled"; exit 0; fi
          url="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          for attempt in 1 2 3 4 5; do
            rm -rf site-repo && git clone -q --depth 1 --branch props-site "$url" site-repo
            mkdir -p site-repo/extra-lines && cp -r pull/* site-repo/extra-lines/
            # line shopping: merge today's every-book snapshots into the site's latest files
            mkdir -p site-repo/best-lines
            for lg in cbb nba; do
              snaps=$(ls pull/sgo/$lg/*.json 2>/dev/null || true)
              if [ -n "$snaps" ]; then node app/scripts/line-history/merge-best-lines.mjs site-repo/best-lines/$lg.json $snaps; fi
            done
            cd site-repo
            git config user.name "line-history-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            if git diff --cached --quiet; then echo "no changes"; exit 0; fi
            git commit -q -m "Extra game lines $(date -u +%Y-%m-%dT%H:%MZ)"
            if git push -q origin props-site; then exit 0; fi
            cd ..
            sleep $((attempt * 15))
          done
          exit 1
