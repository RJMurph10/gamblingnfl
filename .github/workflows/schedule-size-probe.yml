name: Schedule size probe
on:
  push:
    branches: [nfl-weather-probe]
    paths: [probe/schedule-size.ts]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, path: app }
      - uses: actions/checkout@v4
        with: { path: probe-repo }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: mkdir -p "$RUNNER_TEMP/tsx" && npm i --prefix "$RUNNER_TEMP/tsx" --no-audit --no-fund tsx@4.19.2 >/dev/null
      - run: cp probe-repo/probe/schedule-size.ts app/scripts/schedule-size.ts && node "$RUNNER_TEMP/tsx/node_modules/tsx/dist/cli.mjs" --tsconfig app/tsconfig.json app/scripts/schedule-size.ts
