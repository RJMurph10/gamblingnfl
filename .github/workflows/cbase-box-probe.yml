name: College baseball box scores (research)
on:
  push:
    branches: [nfl-weather-probe]
    paths: [scripts/cbase/export-box.mjs, .github/workflows/cbase-box-probe.yml]
permissions:
  contents: write
jobs:
  box:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        year: [2022, 2023, 2024, 2025, 2026]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: git clone -q --depth 1 --branch cbase-history "https://github.com/${{ github.repository }}.git" hist
      - run: node scripts/cbase/export-box.mjs ${{ matrix.year }} hist out  # re-run 2
      - name: Publish to cbase-history
        run: |
          url="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          for attempt in 1 2 3 4 5 6; do
            rm -rf dst && git clone -q --depth 1 --branch cbase-history "$url" dst
            mkdir -p dst/box && cp out/box/${{ matrix.year }}.jsonl.gz dst/box/
            cd dst
            git config user.name "line-history-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            if git diff --cached --quiet; then exit 0; fi
            git commit -q -m "college baseball research data $(date -u +%Y-%m-%d)"
            if git push -q origin cbase-history; then exit 0; fi
            cd ..; sleep $((attempt * 10 + RANDOM % 10))
          done
          exit 1
