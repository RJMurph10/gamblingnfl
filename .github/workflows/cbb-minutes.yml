name: CBB player minutes

# Every D-I men's player's minutes by team and season (scripts/cbb/export-minutes.mjs), for returning-minutes /
# transfer research. Saved to the cbb-history branch as minutes/cbb-minutes-<season>.json. Manual or trigger file.

on:
  workflow_dispatch:
  push:
    branches: [cbb-minutes]
    paths: [scripts/cbb/cbb-minutes.trigger]

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        year: [2022, 2023, 2024, 2025, 2026]
    steps:
      - uses: actions/checkout@v4
        with:
          path: app
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Export and publish
        run: |
          set -e
          node app/scripts/cbb/export-minutes.mjs ${{ matrix.year }} out
          url="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          for attempt in 1 2 3 4 5 6; do
            rm -rf dst && git clone -q --depth 1 --branch cbb-history "$url" dst
            mkdir -p dst/minutes && cp out/*.json dst/minutes/
            cd dst
            git config user.name "line-history-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git diff --cached --quiet && { echo "nothing new"; exit 0; }
            git commit -q -m "CBB minutes ${{ matrix.year }}"
            git push -q origin cbb-history && exit 0
            cd ..
            sleep $((attempt * 20))
          done
          exit 1
