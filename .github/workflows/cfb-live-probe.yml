name: CFB live probe
on:
  push:
    branches: [cfb-live-probe]
    paths: [scripts/probe/cfb-schedule.ts]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund > /dev/null 2>&1 || npm install --no-audit --no-fund > /dev/null 2>&1
      - run: npx -y tsx --tsconfig tsconfig.json scripts/probe/cfb-schedule.ts > probe-out.txt 2>&1 || true
      - run: |
          git config user.name "line-history-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q --orphan out-$GITHUB_RUN_ID
          git rm -rq --cached . 2>/dev/null || true
          git add -f probe-out.txt && git commit -q -m probe && git push -q origin HEAD:refs/heads/cfb-live-probe-out-$GITHUB_RUN_ID
