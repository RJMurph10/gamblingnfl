name: NFL hourly game weather (temporary)
on:
  push:
    branches: [nfl-weather-probe]
    paths: [research/football/scripts/fetch_game_hourly.mjs]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node research/football/scripts/fetch_game_hourly.mjs game_hourly.csv 2012 2026
      - name: Save to the nfl-weather-data branch
        run: |
          gzip -9 game_hourly.csv
          url="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          for attempt in 1 2 3 4 5; do
            rm -rf d && mkdir d && cd d && git init -q && git remote add origin "$url"
            git fetch -q --depth 1 origin nfl-weather-data && git checkout -q -b nfl-weather-data FETCH_HEAD
            cp ../game_hourly.csv.gz .
            git config user.name "research-bot"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A && git commit -q -m "NFL hourly game weather" && git push -q origin nfl-weather-data && exit 0
            cd ..; sleep $((attempt * 10))
          done
          exit 1
