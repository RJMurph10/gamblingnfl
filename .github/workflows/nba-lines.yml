name: NBA game lines

# NBA opening and closing game lines plus each game's note (NBA Cup group / knockout), from ESPN
# (scripts/nba/export-lines.mjs), saved to props-history/nba-lines/nba-lines-<season>.json for angle research.
# Weekly in season for the current season; a manual run (or the trigger file) rebuilds 2022-23 on.

on:
  schedule:
    - cron: "10 13 * 1-6,10-12 1" # Monday mornings
  workflow_dispatch:
  push:
    branches: [nba-lines]
    paths: [scripts/nba/nba-lines.trigger]

permissions:
  contents: write

concurrency:
  group: props-history-nba-lines-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        year: [2022, 2023, 2024, 2025, 2026]
    steps:
      - name: Only the current season on the weekly run
        id: go
        run: |
          y=$(date -u +%Y); m=$(date -u +%m); cur=$([ "$m" -ge 8 ] && echo $y || echo $((y-1)))
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ matrix.year }}" != "$cur" ]; then echo "run=no" >> $GITHUB_OUTPUT; else echo "run=yes" >> $GITHUB_OUTPUT; fi
      - uses: actions/checkout@v4
        if: steps.go.outputs.run == 'yes'
        with:
          path: app
      - uses: actions/setup-node@v4
        if: steps.go.outputs.run == 'yes'
        with:
          node-version: 22
      - name: Export and publish
        if: steps.go.outputs.run == 'yes'
        run: |
          set -e
          node app/scripts/nba/export-lines.mjs ${{ matrix.year }} out
          url="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          for attempt in 1 2 3 4 5 6; do
            rm -rf dst && git clone -q --depth 1 --branch props-history "$url" dst
            mkdir -p dst/nba-lines && cp out/*.json dst/nba-lines/
            cd dst
            git config user.name "line-history-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git diff --cached --quiet && { echo "nothing new"; exit 0; }
            git commit -q -m "NBA game lines ${{ matrix.year }} $(date -u +%Y-%m-%d)"
            git push -q origin props-history && exit 0
            cd ..
            sleep $((attempt * 20))
          done
          exit 1
