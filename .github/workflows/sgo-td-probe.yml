name: SGO TD probe (temporary)
on:
  push:
    branches: [nfl-weather-probe]
    paths: [research/football/scripts/probe_sgo_td.mjs]
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - env:
          SPORTSGAMEODDS_API_KEY: ${{ secrets.SPORTSGAMEODDS_API_KEY }}
        run: node research/football/scripts/probe_sgo_td.mjs
