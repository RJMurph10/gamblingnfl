name: Probe DK prop prices
on:
  push:
    branches: [probe-dk-prices]
    paths: [probe/probe.mjs]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node probe/probe.mjs
      - run: |
          git config user.name probe-bot
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe/result.json && git commit -m "probe result" && git push
