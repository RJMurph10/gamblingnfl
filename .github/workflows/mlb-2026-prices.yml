name: MLB 2026 prop prices (one-time rebuild)
# Rebuilds the 2026 MLB prop history with DraftKings' over/under prices: ESPN keeps them for finished
# games as unlabeled sides (odds.american), which the props code reads since Oct 31, after the season
# ended. Same steps as props-daily.yml for one season.
on:
  push:
    branches: [nfl-weather-probe]
    paths: [.github/workflows/mlb-2026-prices.yml]
permissions:
  contents: write
concurrency:
  group: props-daily
  cancel-in-progress: false
jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          path: app
          sparse-checkout: scripts/line-history
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Download and build
        run: |
          set -e
          node app/scripts/line-history/backfill-props.mjs --league mlb --from 2026-03-15 --to 2026-11-05 --out work/data
          node app/scripts/line-history/build-props-history.mjs --league mlb --data work/data --out work/ph
      - name: Publish
        run: |
          set -e
          url="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          publish() {
            for attempt in 1 2 3 4 5; do
              rm -rf dst && git clone -q --depth 1 --branch "$1" "$url" dst
              ( cd dst && eval "$2" )
              cd dst
              git config user.name "line-history-bot"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add -A
              if git diff --cached --quiet; then cd ..; return 0; fi
              git commit -q -m "mlb 2026 props with prices $(date -u +%Y-%m-%d)"
              if git push -q origin "$1"; then cd ..; return 0; fi
              cd ..; sleep $((attempt * 15))
            done
            return 1
          }
          publish props-site "node ../app/scripts/line-history/build-props-site.mjs --league mlb --data ../work/ph --out . --season 2026 --prices ./mlb/odds-api"
          publish props-history "mkdir -p mlb && cp ../work/ph/mlb/*.jsonl.gz mlb/"
