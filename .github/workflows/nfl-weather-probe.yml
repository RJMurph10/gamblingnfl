name: NFL game weather research fetch (temporary)
on:
  push:
    branches: [nfl-weather-probe]
    paths: [research/football/scripts/fetch_game_weather.mjs]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node research/football/scripts/fetch_game_weather.mjs game_weather.csv 2000 2026
      - name: Save to the nfl-weather-data branch
        run: |
          gzip -9 game_weather.csv
          url="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          mkdir d && cd d && git init -q && git remote add origin "$url"
          git checkout -q --orphan nfl-weather-data
          cp ../game_weather.csv.gz .
          git config user.name "research-bot"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "NFL game weather (Open-Meteo archive)" && git push -q -f origin nfl-weather-data
