name: NFL game weather research fetch (temporary)
on:
  push:
    branches: [nfl-weather-probe]
    paths: [research/football/scripts/fetch_cfb_weather.mjs]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node research/football/scripts/fetch_cfb_weather.mjs cfb_weather.csv
      - name: Save to the nfl-weather-data branch
        run: |
          gzip -9 cfb_weather.csv
          url="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          mkdir d && cd d && git init -q && git remote add origin "$url"
          git fetch -q --depth 1 origin nfl-weather-data && git checkout -q -b nfl-weather-data FETCH_HEAD
          cp ../cfb_weather.csv.gz .
          git config user.name "research-bot"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "CFB game weather (Open-Meteo archive)" && git push -q origin nfl-weather-data
