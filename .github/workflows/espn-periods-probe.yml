name: ESPN periods probe
on:
  push:
    branches: [nfl-weather-probe]
    paths: [probe/espn-periods.mjs]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node probe/espn-periods.mjs
