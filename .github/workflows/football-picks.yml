name: Football picks (live results)

# Records the NFL and college football ★ best bets and watch-list angles the first time they show for a
# game in the next week, at the line on the board then (scripts/picks/football-picks.ts), refreshes the
# line until kickoff, and grades finished picks against the result and ESPN's closing line
# (grade-picks.mjs). Files: props-site/picks/<nfl|cfb>/<day>.json and season-<season>.json, read by the
# Live results card on the NFL and college model pages.
# Runs every 3 hours, September through February.

on:
  schedule:
    - cron: "23 */3 * 1,2,9-12 *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: props-site-picks
  cancel-in-progress: false

jobs:
  picks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: app
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Picks
        run: |
          set -e
          url="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git clone -q --depth 1 --branch props-site "$url" site
          mkdir -p "$RUNNER_TEMP/tsx" && npm i --prefix "$RUNNER_TEMP/tsx" --no-audit --no-fund tsx@4.19.2 >/dev/null
          node "$RUNNER_TEMP/tsx/node_modules/tsx/dist/cli.mjs" app/scripts/picks/football-picks.ts site/picks nfl cfb
          node app/scripts/picks/grade-picks.mjs site/picks || echo "grading failed"
          cd site
          git config user.name "line-history-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -q -m "Football picks $(date -u +%Y-%m-%dT%H:%MZ)"
          for attempt in 1 2 3 4 5; do
            if git push -q origin props-site; then exit 0; fi
            git pull -q --rebase origin props-site
            sleep $((attempt * 10))
          done
          exit 1
