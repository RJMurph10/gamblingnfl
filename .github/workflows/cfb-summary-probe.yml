name: CFB summary probe (temporary)
on:
  push:
    branches: [nfl-weather-probe]
    paths: [research/football/scripts/probe_cfb_summary.mjs]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node research/football/scripts/probe_cfb_summary.mjs
