name: Football picks dry run (temporary)
on:
  push:
    branches: [nfl-weather-probe]
    paths: [scripts/picks/football-picks.ts, .github/workflows/football-picks-probe.yml]
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: mkdir -p "$RUNNER_TEMP/tsx" && npm i --prefix "$RUNNER_TEMP/tsx" --no-audit --no-fund tsx@4.19.2 >/dev/null
      - run: node "$RUNNER_TEMP/tsx/node_modules/tsx/dist/cli.mjs" scripts/picks/football-picks.ts out nfl cfb
      - run: for f in out/*/*.json; do echo "== $f"; node -e 'const d=require("./"+process.argv[1]);for(const p of d.picks)console.log(p.best?"★":"◦",p.tag.padEnd(12),p.game.padEnd(14),p.pick.padEnd(12),"open",p.open,"now",p.latest,p.note??"")' "$f"; done
      - run: |
          mkdir -p g/nfl && cp out/nfl/*.json g/nfl/ 2>/dev/null || true
          node scripts/picks/grade-picks.mjs g && ls g/nfl
