name: Game lines (The Odds API)

# Spreads and totals for one sport from The Odds API (every listed US book), saved to
# props-site/odds-api/<sport>/. One pull costs 2 credits for every game of the sport.
# Runs on demand: push scripts/line-history/odds-api-games.trigger (first line = the sport key).
# Needs the repository secret ODDS_API_KEY; without it the job does nothing.

on:
  workflow_dispatch:
  push:
    branches: [odds-api-games]
    paths: [scripts/line-history/odds-api-games.trigger, scripts/line-history/sgo-probe.trigger]

permissions:
  contents: write

concurrency:
  group: props-site-odds-api
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: app
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pull lines and publish
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          SPORTSGAMEODDS_API_KEY: ${{ secrets.SPORTSGAMEODDS_API_KEY }}
        run: |
          set -e
          if git -C app diff --name-only HEAD~1 HEAD 2>/dev/null | grep -q sgo-probe.trigger; then
            node app/scripts/line-history/sgo-probe.mjs --out pull/sgo
          else
            if [ -z "$ODDS_API_KEY" ]; then echo "ODDS_API_KEY secret not set; skipping."; exit 0; fi
            SPORT=$(head -1 app/scripts/line-history/odds-api-games.trigger | tr -d '[:space:]')
            node app/scripts/line-history/odds-api-games.mjs --sport "${SPORT:-basketball_wncaab}" --out pull
          fi
          if [ -z "$(ls pull 2>/dev/null)" ]; then echo "nothing pulled"; exit 0; fi
          url="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          for attempt in 1 2 3 4 5; do
            rm -rf site-repo && git clone -q --depth 1 --branch props-site "$url" site-repo
            mkdir -p site-repo/odds-api && cp -r pull/* site-repo/odds-api/
            cd site-repo
            git config user.name "line-history-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            if git diff --cached --quiet; then echo "no changes"; exit 0; fi
            git commit -q -m "Odds API game lines $(date -u +%Y-%m-%dT%H:%MZ)"
            if git push -q origin props-site; then exit 0; fi
            cd ..
            sleep $((attempt * 15))
          done
          exit 1
