name: NFL opening lines

# Opening and closing NFL game lines from ESPN's core odds feed (scripts/nfl/export-openers.mjs), saved to the
# props-history branch as nfl-lines/nfl-lines-<season>.json for angle research against the opener.
# Weekly during the season for the current year; a manual run (or the trigger file) rebuilds 2022 on.

on:
  schedule:
    - cron: "30 13 * 1,9-12 2" # Tuesday mornings, after Monday night
  workflow_dispatch:
  push:
    branches: [nfl-openers]
    paths: [scripts/nfl/nfl-openers.trigger]

permissions:
  contents: write

concurrency:
  group: props-history-nfl-lines
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          path: app
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Export and publish
        run: |
          set -e
          y=$(date -u +%Y); m=$(date -u +%m); cur=$([ "$m" -ge 8 ] && echo $y || echo $((y-1)))
          if [ "${{ github.event_name }}" = "schedule" ]; then years="$cur"; else years="2022 2023 2024 2025 $cur"; fi
          for yr in $years; do node app/scripts/nfl/export-openers.mjs $yr out; done
          url="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          for attempt in 1 2 3 4 5; do
            rm -rf dst && git clone -q --depth 1 --branch props-history "$url" dst
            mkdir -p dst/nfl-lines && cp out/*.json dst/nfl-lines/
            cd dst
            git config user.name "line-history-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git diff --cached --quiet && { echo "nothing new"; exit 0; }
            git commit -q -m "NFL opening lines $(date -u +%Y-%m-%d)"
            git push -q origin props-history && exit 0
            cd ..
            sleep $((attempt * 15))
          done
          exit 1
