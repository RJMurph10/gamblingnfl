name: NFL prop prices (SportsGameOdds)

# DraftKings over/under prices for every NFL player prop on the board (passing, rushing, receiving,
# TDs, interceptions, combos), saved to props-site/nfl/odds-api next to The Odds API pulls.
# Free plan: 2,500 events a month shared with the NHL period and college basketball pulls;
# one game = one event. About 60 events a week:
#   9:41am and 5:41pm Central: games in the next 30h (Thursday, Saturday, Sunday and Monday games on the day)
#   plus any later game whose lines ESPN already shows without prices (priced once as soon as lines post)
#   Wednesday morning: the whole week
#   shortly before kickoff (games in the next 3 hours only, about 17 events a week): Sunday 10:20am,
#   1:40pm and 5:50pm Central in standard time (16:20, 19:40, 23:50 UTC; an hour later in daylight time), Thursday and
#   Monday 5:50pm Central; then the board is rebuilt so the closing lines carry these prices
#   about 45 minutes after the Sunday, Thursday and Monday kickoffs (--live, games in progress only):
#   each prop's closing line and price, averaged across books, for props whose DraftKings price wasn't
#   saved before kickoff (tagged CLOSE on the site)
# The same events also carry every book's halves, quarters, team totals, specials and player 1st-half /
# quarter props: saved to props-site markets/nfl.json (no extra events), and the quarter / half edge finder
# writes nfl/partials-<season>.json (flags + grades).
# Needs the repository secret SPORTSGAMEODDS_API_KEY; without it the job does nothing.

on:
  schedule:
    - cron: "41 15 * 1,2,9-12 *" # 9:41am Central
    - cron: "41 23 * 1,2,9-12 *" # 5:41pm Central: prices for lines posted during the day
    - cron: "20 16 * 1,2,9-12 0" # Sunday before the noon games
    - cron: "40 19 * 1,2,9-12 0" # Sunday before the 3pm games
    - cron: "50 23 * 1,2,9-12 0,1,4" # before Sunday, Monday and Thursday night games
    - cron: "45 18 * 1,2,9-12 0" # live: after the noon kickoffs
    - cron: "5 22 * 1,2,9-12 0" # live: after the 3pm kickoffs
    - cron: "5 2 * 1,2,9-12 1,2,5" # live: after the Sunday, Monday and Thursday night kickoffs
  workflow_dispatch:
    inputs:
      hours:
        description: "Price every game starting in the next N hours"
        required: false
        default: ""
      live:
        description: "Games in progress: save their closing lines (fills props priced too late)"
        type: boolean
        default: false
  push:
    branches: [sgo-props]
    paths: [scripts/line-history/sgo-nfl-props.trigger]

permissions:
  contents: write
  actions: write # to rebuild the props board right after (GitHub often skips the hourly run)

concurrency:
  group: props-site-odds-api
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: app
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pull prices and publish
        env:
          SPORTSGAMEODDS_API_KEY: ${{ secrets.SPORTSGAMEODDS_API_KEY }}
        run: |
          set -e
          if [ -z "$SPORTSGAMEODDS_API_KEY" ]; then echo "SPORTSGAMEODDS_API_KEY secret not set; skipping."; exit 0; fi
          HOURS=30
          if [ "$(date -u +%u)" = "3" ] && [ "$(date -u +%H)" = "15" ]; then HOURS=132; fi
          case "${{ github.event.schedule }}" in
            "20 16 * 1,2,9-12 0" | "40 19 * 1,2,9-12 0" | "50 23 * 1,2,9-12 0,1,4") HOURS=3 ;;
          esac
          if [ -n "${{ inputs.hours }}" ]; then HOURS="${{ inputs.hours }}"; fi
          LIVE=""
          case "${{ github.event.schedule }}" in
            "45 18 * 1,2,9-12 0" | "5 22 * 1,2,9-12 0" | "5 2 * 1,2,9-12 1,2,5") LIVE="--live" ;;
          esac
          if [ "${{ inputs.live }}" = "true" ]; then LIVE="--live"; fi
          # later games ESPN already lists DraftKings lines for, with no saved prices yet: price them once now
          ALSO=$(curl -sf https://raw.githubusercontent.com/${{ github.repository }}/props-site/nfl/upcoming.json \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const h=+process.argv[1];
                const t=new Set();for(const g of JSON.parse(s||"[]")){const k=Date.parse(g.date);
                if(k>Date.now()+h*36e5&&g.props.length&&!g.props.some(p=>p[4]!=null||p[5]!=null))t.add(new Date(k).toISOString())}
                console.log([...t].join(","))})' $HOURS || true)
          echo "unpriced later kickoffs: ${ALSO:-none}"
          if [ -n "$LIVE" ]; then ALSO=""; fi
          node app/scripts/line-history/sgo-nfl-props.mjs --out pull --hours $HOURS --also "$ALSO" --best best/nfl.json --markets more/nfl.json $LIVE
          if [ -z "$(ls pull 2>/dev/null)" ]; then echo "no prop prices pulled"; fi
          url="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          for attempt in 1 2 3 4 5; do
            rm -rf site-repo && git clone -q --depth 1 --branch props-site "$url" site-repo
            mkdir -p site-repo/nfl/odds-api && cp pull/*.json site-repo/nfl/odds-api/ 2>/dev/null || true
            # halves, quarters, team totals, specials and player period props; then the quarter / half
            # edge finder flags new edges and grades finished games (scripts/props/nfl-partials.mjs)
            if [ -f more/nfl.json ]; then mkdir -p site-repo/markets && node app/scripts/line-history/merge-best-lines.mjs site-repo/markets/nfl.json more/nfl.json; fi
            node app/scripts/props/nfl-partials.mjs --markets site-repo/markets/nfl.json --out site-repo || echo "edge finder failed"
            # line shopping: every book's spreads and totals, merged into the site's latest file
            if [ -f best/nfl.json ]; then mkdir -p site-repo/best-lines && node app/scripts/line-history/merge-best-lines.mjs site-repo/best-lines/nfl.json best/nfl.json; fi
            # the hourly line saver merges these into upcoming.json; the daily props job into past results
            cd site-repo
            git config user.name "line-history-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            if git diff --cached --quiet; then echo "no changes"; exit 0; fi
            git commit -q -m "NFL prop prices (SportsGameOdds) $(date -u +%Y-%m-%dT%H:%MZ)"
            if git push -q origin props-site; then exit 0; fi
            cd ..
            sleep $((attempt * 15))
          done
          exit 1
      - name: Rebuild the props board with the new prices
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run line-history.yml -R ${{ github.repository }} --ref main
