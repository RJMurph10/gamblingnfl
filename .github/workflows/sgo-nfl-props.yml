name: NFL prop prices (SportsGameOdds)

# DraftKings over/under prices for every NFL player prop on the board (passing, rushing, receiving,
# TDs, interceptions, combos), saved to props-site/nfl/odds-api next to The Odds API pulls.
# Free plan: 2,500 events a month shared with the NHL period and college basketball pulls;
# one game = one event. About 60 events a week:
#   9:41am and 5:41pm Central: games in the next 30h (Thursday, Saturday, Sunday and Monday games on the day)
#   plus any later game whose lines ESPN already shows without prices (priced once as soon as lines post)
#   Wednesday morning: the whole week
# Needs the repository secret SPORTSGAMEODDS_API_KEY; without it the job does nothing.

on:
  schedule:
    - cron: "41 15 * 1,2,9-12 *" # 9:41am Central
    - cron: "41 23 * 1,2,9-12 *" # 5:41pm Central: prices for lines posted during the day
  workflow_dispatch:
    inputs:
      hours:
        description: "Price every game starting in the next N hours"
        required: false
        default: ""
  push:
    branches: [sgo-props]
    paths: [scripts/line-history/sgo-nfl-props.trigger]

permissions:
  contents: write
  actions: write # to rebuild the props board right after (GitHub often skips the hourly run)

concurrency:
  group: props-site-odds-api
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: app
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pull prices and publish
        env:
          SPORTSGAMEODDS_API_KEY: ${{ secrets.SPORTSGAMEODDS_API_KEY }}
        run: |
          set -e
          if [ -z "$SPORTSGAMEODDS_API_KEY" ]; then echo "SPORTSGAMEODDS_API_KEY secret not set; skipping."; exit 0; fi
          HOURS=30
          if [ "$(date -u +%u)" = "3" ] && [ "$(date -u +%H)" = "15" ]; then HOURS=132; fi
          if [ -n "${{ inputs.hours }}" ]; then HOURS="${{ inputs.hours }}"; fi
          # later games ESPN already lists DraftKings lines for, with no saved prices yet: price them once now
          ALSO=$(curl -sf https://raw.githubusercontent.com/${{ github.repository }}/props-site/nfl/upcoming.json \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const h=+process.argv[1];
                const t=new Set();for(const g of JSON.parse(s||"[]")){const k=Date.parse(g.date);
                if(k>Date.now()+h*36e5&&g.props.length&&!g.props.some(p=>p[4]!=null||p[5]!=null))t.add(new Date(k).toISOString())}
                console.log([...t].join(","))})' $HOURS || true)
          echo "unpriced later kickoffs: ${ALSO:-none}"
          node app/scripts/line-history/sgo-nfl-props.mjs --out pull --hours $HOURS --also "$ALSO" --best best/nfl.json
          if [ -z "$(ls pull 2>/dev/null)" ]; then echo "nothing pulled"; exit 0; fi
          url="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          for attempt in 1 2 3 4 5; do
            rm -rf site-repo && git clone -q --depth 1 --branch props-site "$url" site-repo
            mkdir -p site-repo/nfl/odds-api && cp pull/*.json site-repo/nfl/odds-api/
            # line shopping: every book's spreads and totals, merged into the site's latest file
            if [ -f best/nfl.json ]; then mkdir -p site-repo/best-lines && node app/scripts/line-history/merge-best-lines.mjs site-repo/best-lines/nfl.json best/nfl.json; fi
            # the hourly line saver merges these into upcoming.json; the daily props job into past results
            cd site-repo
            git config user.name "line-history-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            if git diff --cached --quiet; then echo "no changes"; exit 0; fi
            git commit -q -m "NFL prop prices (SportsGameOdds) $(date -u +%Y-%m-%dT%H:%MZ)"
            if git push -q origin props-site; then exit 0; fi
            cd ..
            sleep $((attempt * 15))
          done
          exit 1
      - name: Rebuild the props board with the new prices
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run line-history.yml -R ${{ github.repository }} --ref main
