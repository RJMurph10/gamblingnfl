name: Site health
# Every hour: are the scheduled jobs running, is the data fresh, do the outside feeds (ESPN, NCAA,
# Open-Meteo, NWS, odds APIs) still answer the way the code expects? Writes props-site
# health/status.json for the site's Status page (/status) and pushes an ntfy alert (NTFY_TOPIC) when a
# check starts failing or recovers. scripts/health/check.mjs lists the checks.
on:
  schedule:
    - cron: "52 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: site-health
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/health
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SPORTSGAMEODDS_API_KEY: ${{ secrets.SPORTSGAMEODDS_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          set -e
          url="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git clone -q --depth 1 --branch props-site --filter=blob:none --sparse "$url" site
          (cd site && git sparse-checkout set health)
          node scripts/health/check.mjs site
      - name: Publish
        run: |
          url="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          for attempt in 1 2 3 4 5; do
            rm -rf dst && git clone -q --depth 1 --branch props-site --filter=blob:none --sparse "$url" dst
            (cd dst && git sparse-checkout set health)
            mkdir -p dst/health && cp site/health/status.json dst/health/
            cd dst
            git config user.name "line-history-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add health/status.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -q -m "site health $(date -u +%Y-%m-%dT%H:%M)"
            if git push -q origin props-site; then exit 0; fi
            cd ..; sleep $((attempt * 10))
          done
          exit 1
